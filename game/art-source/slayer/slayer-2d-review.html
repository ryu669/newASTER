<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>スレイヤー・2D比較試作</title>
<style>body{margin:0;background:#20252d;color:#eee;font:16px system-ui}header{padding:18px 24px}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0;color:#bec8d4}button{padding:10px 18px;margin:4px;border:1px solid #789;background:#293d4b;color:white;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#665345;border-color:#ffc68c}#stage{height:76vh;display:flex;justify-content:center;background:#3c424a;overflow:hidden}img{height:100%;width:100%;object-fit:contain}footer{padding:10px 24px;color:#c1c7cf}</style>
<header><h1>スレイヤー・2D比較試作</h1><p>静止画の品質・一貫性確認用。ゲーム画面・完成素材・3Dモデルではありません。</p>
<nav aria-label="画像選択"><button data-file="slayer-2d-direction-study-v1.png" aria-pressed="true">通常</button><button data-file="slayer-2d-smile-v1.png" aria-pressed="false">微笑み</button><button data-file="slayer-2d-angry-v1.png" aria-pressed="false">怒り</button><button data-file="slayer-2d-fullbody-v1.png" aria-pressed="false">全身・透過</button></nav>
<nav aria-label="背景選択"><button data-bg="#3c424a">灰色背景</button><button data-bg="#12131a">暗い背景</button><button data-bg="#f1e9df">明るい背景</button></nav></header>
<main id="stage"><img id="art" src="slayer-2d-direction-study-v1.png" alt="スレイヤー・通常表情"></main>
<footer>表情は独立した画像です。顔以外の完全一致、アニメーション、全身の表情差分は未検証・未制作。全身は羽根先の余白調整が必要です。</footer>
<script>document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-file]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('art').src=b.dataset.file;document.getElementById('art').alt='スレイヤー・'+b.textContent});document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>document.getElementById('stage').style.background=b.dataset.bg);</script></html>
